<script>
    function verificaIndiciu() {
        const input = document.getElementById("indicii").value.trim().toLowerCase();
        const mesaj = document.getElementById("mesaj");

        if (input === "tacere") {
            window.location.href = "/tacere";
        } else if (input === "tacerea") {
            window.location.href = "/tacerea";
        } else {
            mesaj.innerText = "nu cred că la asta s-a gândit profesorul";
        }
    }
</script>
